[project]
name = "agentflow-adapters"
version = "0.1.0"
description = "CLI adapters for the Agentflow runner."
requires-python = ">=3.11"
dependencies = ["agentflow-kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow_adapters"]
