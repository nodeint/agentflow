[project]
name = "agentflow-cli"
version = "0.1.0"
description = "Command line for the Agentflow runner."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "agentflow-kernel",
    "agentflow-adapters",
    "rich>=15.0.0",
    "typer>=0.20",
    "inquirerpy>=0.3.4",
]

[project.scripts]
agentflow = "agentflow_cli.run:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow_cli"]
